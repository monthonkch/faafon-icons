# ภาพเรดาร์รวมกรมอุตุฯ + แผนที่ → branch "radar" (ใช้ในบอท ฟ้าฝนไทย) ทุก 15 นาที
name: radar
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y -qq libraqm0 >/dev/null && pip install -q pillow==11.0.0
      - name: แผนที่พื้นหลัง (สร้างครั้งเดียว แล้วเก็บ cache)
        id: base
        uses: actions/cache@v4
        with:
          path: radar/base_*.png
          key: base-${{ hashFiles('radar/gen_base.py', 'radar/provinces.py') }}
      - if: steps.base.outputs.cache-hit != 'true'
        run: python radar/gen_base.py
      - name: build
        run: |
          export PREV_UTC="$(curl -fsS https://raw.githubusercontent.com/${{ github.repository }}/radar/latest.json | python -c 'import sys,json;print(json.load(sys.stdin)["utc"])' || true)"
          python radar/radar.py
      - name: คลิปเรดาร์ + พยากรณ์ 3 ชม. (กรมอุตุฯ wxmap)
        if: hashFiles('radar/out/CHANGED') != ''
        continue-on-error: true
        run: |
          which ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg >/dev/null
          python radar/clip.py
      - name: publish
        if: hashFiles('radar/out/CHANGED') != ''
        run: |
          cd radar/out && rm CHANGED && touch .nojekyll   # GitHub Pages เสิร์ฟ mp4 เป็น video/mp4 ให้ LINE
          git init -q -b radar
          git add .
          git -c user.name=radar-bot -c user.email=radar-bot@users.noreply.github.com commit -qm "radar $(date -u +%FT%H:%M)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" radar
